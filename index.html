<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>حاسبة تسعير شحن آسياسيل</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حاسبة آسيا">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1020;--card:#161f3a;--card2:#1e2948;--tx:#f2f5fc;--mut:#8f9bbd;--ac:#2ee6a0;--ac2:#22b8f0;--acx:#04241a;--bd:#2a3659;--warn:#ffc266;--sh:0 10px 30px rgba(0,0,0,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eaf0fa;--card:#fff;--card2:#edf2fb;--tx:#111a2e;--mut:#59678a;--ac:#0b9e69;--ac2:#0a86c4;--acx:#fff;--bd:#cdd7ea;--warn:#a65f00;--sh:0 8px 24px rgba(30,50,90,.14)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;width:100%;overflow:hidden;overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-user-select:none;user-select:none;background:radial-gradient(800px 380px at 50% -100px,color-mix(in srgb,var(--ac2) 24%,transparent),transparent),var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.4}
input{-webkit-user-select:text;user-select:text}
.app{height:100%;max-width:480px;margin:0 auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:12px}
button{font-family:inherit;color:var(--tx);cursor:pointer;transition:transform .1s,background .15s}
button:active{transform:scale(.97)}
input{width:100%;min-height:44px;padding:6px 8px;border-radius:11px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:16px;font-family:inherit;text-align:center;transition:border-color .15s,box-shadow .15s}
input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.top{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:var(--sh)}
.top h1{font-size:16px;margin:0;line-height:1.2}.top p{margin:0;font-size:11.5px;color:var(--mut)}
/* HERO */
.hero{flex:none;position:relative;overflow:hidden;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;
background:linear-gradient(150deg,color-mix(in srgb,var(--ac) 32%,var(--card)),color-mix(in srgb,var(--ac2) 28%,var(--card)) 70%,var(--card));
border:1px solid color-mix(in srgb,var(--ac) 50%,var(--bd));box-shadow:0 12px 30px rgba(0,0,0,.38),0 0 0 1px rgba(255,255,255,.04) inset}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 40%,transparent),transparent 70%);pointer-events:none}
.ht{position:relative;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.ht span.l{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.badge{background:color-mix(in srgb,var(--bg) 55%,transparent);border-radius:999px;padding:3px 12px;color:var(--mut)}
.badge b{color:var(--tx);font-size:14px;direction:ltr;unicode-bidi:isolate}
.mid{position:relative;display:grid;grid-template-columns:1.3fr 1px 1fr;align-items:center;gap:8px}
.mid hr{width:1px;height:52px;border:0;margin:0;background:linear-gradient(transparent,var(--mut),transparent);opacity:.55}
.nb{text-align:center}
.nb small{display:block;font-size:11px;color:var(--mut)}
.nb b{display:block;line-height:1.15;font-weight:800;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,var(--tx),var(--ac));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--ac)}
#sd{font-size:clamp(30px,10vw,44px)}#su{font-size:clamp(24px,7.4vw,32px)}
.nb em{font-style:normal;font-size:12px;color:var(--mut)}
.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.pn{transition:none}}
.st{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st div{background:color-mix(in srgb,var(--bg) 50%,transparent);border-radius:11px;padding:6px 4px;text-align:center}
.st small{display:block;font-size:10.5px;color:var(--mut)}
.st b{font-size:13px;direction:ltr;unicode-bidi:isolate;display:block}
.st .pf b{color:var(--ac)}
.st i{font-style:normal;font-size:10.5px;color:var(--mut);direction:ltr;unicode-bidi:isolate;display:block}
.note{position:relative;font-size:11.5px;color:var(--warn);text-align:center;margin-top:-4px}
.note:empty{display:none}
/* columns: button + its own panel underneath */
.cards{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;overflow-y:auto;scrollbar-width:none;padding-bottom:2px}
.cards::-webkit-scrollbar{display:none}
.col{display:flex;flex-direction:column;min-width:0}
.ob{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:16px;min-height:60px;padding:8px 10px;display:flex;align-items:center;gap:10px;text-align:right;box-shadow:var(--sh)}
.ob.open{border-color:var(--ac)}
.ob .ic{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--ac) 16%,var(--card2))}
.ob .tx{min-width:0;display:flex;flex-direction:column}
.ob small{font-size:11px;color:var(--mut);line-height:1.3}
.ob b{font-size:15px;font-weight:800;direction:ltr;unicode-bidi:isolate;text-align:right;line-height:1.3;white-space:nowrap}
.pn{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s}
.pn.open{grid-template-rows:1fr}
.pn>div{min-height:0;overflow:hidden}
.bx{margin-top:8px;padding:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh)}
.bx label{display:block;font-size:11.5px;color:var(--mut);margin:10px 0 4px}
.bx label:first-child{margin-top:0}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{min-height:40px;border-radius:11px;border:1px solid var(--bd);background:var(--card2);font-size:15px;padding:2px}
.chip.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acx);border-color:transparent;font-weight:800;box-shadow:0 3px 12px color-mix(in srgb,var(--ac) 35%,transparent)}
.custom{border-style:dashed;font-size:16px}
.custom.on{border-style:solid;border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--card2));font-weight:800}
.sec{margin-top:10px;padding-top:2px;border-top:1px dashed var(--bd)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:2px;gap:2px}
.seg button{min-height:34px;border:0;background:transparent;border-radius:8px;font-size:13px;padding:0}
.seg button.on{background:var(--card);color:var(--ac);font-weight:800;box-shadow:0 1px 6px rgba(0,0,0,.25)}
@media (max-height:640px){.app{gap:8px}.top p,.nb small{display:none}.ob{min-height:52px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">💳</div><div><h1>حاسبة تسعير شحن آسياسيل</h1><p>سعر الزبون وصافي ربحك بلحظة</p></div></div>

<div class="hero">
<div class="ht"><span class="l"><span class="dot"></span>سعر البيع النهائي</span><span class="badge">فئة <b id="bd">10$</b></span></div>
<div class="mid">
<div class="nb"><small>بالدينار</small><b id="sd">0</b><em>د.ع</em></div>
<hr>
<div class="nb"><small>بالدولار</small><b id="su">0</b><em>$</em></div>
</div>
<div class="st">
<div><small>رصيد الآسيا</small><b id="bal">0</b></div>
<div><small>التكلفة</small><b id="cost">0</b></div>
<div class="pf"><small>صافي الربح</small><b id="pd">0</b><i id="pu">0$</i></div>
</div>
</div>

<div class="cards">
<div class="col">
<div class="ob" id="o2"><span class="ic">💵</span><span class="tx"><small>الفئة · الربح</small><b id="s4">10$</b></span></div>
<div class="pn open" id="p2"><div><div class="bx">
<div class="g" id="amts"></div>
<div class="sec">
<label for="pf">الربح بالدينار</label>
<input id="pf" type="number" inputmode="decimal" placeholder="0">
</div>
</div></div></div>
</div>
<div class="col">
<div class="ob" id="o1"><span class="ic">⚙️</span><span class="tx"><small>آسيا · الدولار</small><b id="s2">970 · 1,700</b></span></div>
<div class="pn open" id="p1"><div><div class="bx">
<label for="ar">سعر الآسيا لكل 1,000</label>
<input id="ar" type="number" inputmode="decimal">
<label for="ur">سعر الدولار بالسوق</label>
<input id="ur" type="number" inputmode="decimal">
</div></div></div>
</div>
</div>
</div>

<script>
(function(){
var KEY="asiacell-calc-v2",$=function(i){return document.getElementById(i)};
var AM=[5,10,12,20,25,40,50,100];
var S={b100:152000,ar:970,ur:1700,am:10,pf:1000,rd:0};
try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)for(var k in S)if(typeof s[k]==="number"&&isFinite(s[k]))S[k]=s[k]}catch(e){}
S.rd=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function f(n,d){return (isFinite(n)?n:0).toLocaleString("en-US",{maximumFractionDigits:d==null?0:d})}
["gesturestart","gesturechange","gestureend"].forEach(function(e){document.addEventListener(e,function(ev){ev.preventDefault()})});
document.addEventListener("dblclick",function(e){e.preventDefault()});
document.addEventListener("touchmove",function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
var cu=document.createElement("input");cu.className="chip custom";cu.type="number";cu.inputMode="decimal";cu.placeholder="＋";cu.setAttribute("aria-label","مبلغ آخر بالدولار");
AM.forEach(function(v){var b=document.createElement("button");b.type="button";b.className="chip";b.dataset.v=v;b.textContent=v+"$";b.onclick=function(){S.am=v;cu.value="";calc()};$("amts").appendChild(b)});
$("amts").appendChild(cu);
cu.addEventListener("input",function(){var n=parseFloat(cu.value);S.am=isFinite(n)?n:0;calc()});
if(AM.indexOf(S.am)<0)cu.value=S.am;
["ar","ur","pf"].forEach(function(id){$(id).value=S[id];$(id).addEventListener("input",function(){var n=parseFloat($(id).value);S[id]=isFinite(n)?n:0;calc()})});
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function tw(id,to,d){var el=$(id),from=el._v==null?to:el._v;el._v=to;cancelAnimationFrame(el._r);
if(reduce||from===to){el.textContent=f(to,d);return}
var t0=performance.now();(function st(t){var p=Math.min(1,(t-t0)/320),e=1-Math.pow(1-p,3);el.textContent=f(from+(to-from)*e,d);if(p<1)el._r=requestAnimationFrame(st)})(t0);
el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
function calc(){
var bal=S.am/100*S.b100,cost=bal/1000*S.ar,pre=cost+S.pf;
var fin=S.rd>0?Math.ceil(pre/S.rd-1e-9)*S.rd:pre;
var fu=S.ur>0?fin/S.ur:0,pd=fin-cost,pu=S.ur>0?pd/S.ur:0;
tw("sd",fin);tw("su",fu,2);
$("bd").textContent=f(S.am,2)+"$";$("s4").textContent=f(S.am,2)+"$ · "+f(S.pf);
$("bal").textContent=f(bal);$("cost").textContent=f(cost)+" د.ع";
$("pd").textContent=f(pd)+" د.ع";$("pu").textContent=f(pu,2)+"$";
$("s2").textContent=f(S.ar)+" · "+f(S.ur);
[].forEach.call($("amts").querySelectorAll("button"),function(b){b.classList.toggle("on",Number(b.dataset.v)===S.am&&!cu.value)});
cu.classList.toggle("on",!!cu.value);
save();
}
calc();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
